[package]
name        = "contextflow-desktop"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "ContextFlow desktop shell (Tauri 2)."

[lints]
workspace = true

[lib]
name       = "contextflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Apps don't need to be on crates.io; this silences the warning.
[package.metadata]
publish = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri        = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
anyhow       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }

# Internal crates
contextflow-telemetry     = { workspace = true }
contextflow-ipc-contracts = { workspace = true }

[features]
# Tauri's default custom-protocol feature is enabled for release builds by the CLI.
custom-protocol = ["tauri/custom-protocol"]
