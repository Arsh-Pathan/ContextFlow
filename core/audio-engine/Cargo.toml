[package]
name        = "contextflow-audio-engine"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "Microphone capture, resampling, VAD, and ring buffer for ContextFlow."

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
serde       = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }

# Audio capture: `cpal` is the de facto Rust cross-platform audio crate;
# on Windows it talks WASAPI.
cpal       = { workspace = true }

# Resampling from device-native rate (typically 44.1/48 kHz) → 16 kHz mono.
rubato     = { workspace = true }

# Voice Activity Detection: lightweight, battle-tested WebRTC VAD port.
webrtc-vad = { workspace = true }

[dev-dependencies]
tokio                = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
contextflow-telemetry = { workspace = true }
