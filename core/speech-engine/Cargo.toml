[package]
name        = "contextflow-speech-engine"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "SpeechProvider trait and concrete speech engines (Windows SR, whisper.cpp, faster-whisper, Deepgram, OpenAI Realtime)."

[lints]
workspace = true

[features]
# Default to no concrete providers: the trait is the public contract and
# every backend is feature-gated. The desktop app enables the providers
# it needs in its own Cargo.toml.
default = []
provider-windows         = ["dep:windows"] # Slice 1, in progress
provider-whisper-cpp     = ["dep:whisper-rs"] # Slice 2
# Enable CUDA acceleration for the whisper.cpp provider.
# Only activate this on machines that have the NVIDIA CUDA 12 toolkit
# installed (cublas64_13.dll / libcublas.so.12 must be present at runtime).
# Without this flag the CPU backend is used, which works everywhere.
provider-whisper-cpp-cuda = ["provider-whisper-cpp", "whisper-rs/cuda"]
provider-faster-whisper  = []              # Slice 2
provider-deepgram        = []              # Slice 4
provider-openai-realtime = []              # Slice 4

[dependencies]
async-trait = { workspace = true }
futures     = { workspace = true }
serde       = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tokio-stream = { workspace = true }
tracing     = { workspace = true }

# Windows provider deps — only pulled in when the feature is on.
windows = { workspace = true, optional = true }

# Whisper.cpp provider deps — no "cuda" feature here; use
# `provider-whisper-cpp-cuda` at the crate-consumer level to opt into
# GPU acceleration only on machines with CUDA 12 installed.
whisper-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio                 = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
contextflow-telemetry = { workspace = true }

# `cargo build --workspace` without `--features provider-windows` should not
# attempt to compile the WinRT smoke test (it would fail at the `providers::`
# import). `required-features` makes cargo skip this example unless the
# feature is on.
[[example]]
name              = "windows_sr_smoke"
required-features = ["provider-windows"]
