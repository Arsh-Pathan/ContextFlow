[package]
name        = "contextflow-text-injection"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
authors     = { workspace = true }
license     = { workspace = true }
repository  = { workspace = true }
description = "UIA / SendInput / clipboard text-injection strategies for Windows."

[lints]
workspace = true

[dependencies]
arboard = "3.6.1"
async-trait = { workspace = true }
serde       = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }

# Slice 1 ships SendInput Unicode via the `windows` crate.
# Slice 3 will additionally pull in UI Automation paths.
windows = { workspace = true }

[dev-dependencies]
tokio                 = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
contextflow-telemetry = { workspace = true }
