<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Centered content -->
  <g transform="translate(600, 180)">
    
    <!-- Voice Bar Demo -->
    <g transform="translate(0, -60)">
      <!-- Outer Glow -->
      <rect x="-184" y="-48" width="368" height="96" rx="48" fill="none" stroke="url(#brand)" stroke-width="16" opacity="0.4" filter="url(#glow)"/>
      
      <!-- App Container -->
      <rect x="-180" y="-44" width="360" height="88" rx="44" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
      
      <!-- ContextFlow Logo -->
      <g transform="translate(-132, 0)">
        <circle cx="0" cy="0" r="28" fill="url(#brand)"/>
        <circle cx="0" cy="0" r="8" fill="white" fill-opacity="0.85"/>
      </g>

      <!-- Audio Visualizer Dots (Accurate to code: 6 bars, scaled to 10px wide, varying heights) -->
      <rect x="-55" y="-12" width="10" height="24" rx="5" fill="white"/>
      <rect x="-35" y="-24" width="10" height="48" rx="5" fill="white"/>
      <rect x="-15" y="-32" width="10" height="64" rx="5" fill="white"/>
      <rect x="5" y="-18" width="10" height="36" rx="5" fill="white"/>
      <rect x="25" y="-28" width="10" height="56" rx="5" fill="white"/>
      <rect x="45" y="-16" width="10" height="32" rx="5" fill="white"/>

      <!-- Close (X) Button -->
      <g transform="translate(132, 0)">
        <circle cx="0" cy="0" r="24" fill="white" fill-opacity="0.05"/>
        <path d="M-7 -7 L7 7 M7 -7 L-7 7" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Title -->
    <text x="0" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="white" letter-spacing="-0.03em">
      ContextFlow
    </text>

    <!-- Tagline -->
    <text x="0" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8" font-weight="400" letter-spacing="0.01em">
      Windows-native AI voice dictation. Your thoughts, in flow.
    </text>
  </g>
</svg>
