<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Centered content -->
  <g transform="translate(600, 160)">
    
    <!-- Logo with subtle glow -->
    <g transform="translate(0, -40)">
      <!-- Outer glow -->
      <circle cx="0" cy="0" r="48" fill="url(#brand)" opacity="0.3" filter="url(#glow)"/>
      <!-- Main circle -->
      <circle cx="0" cy="0" r="48" fill="url(#brand)"/>
      <!-- Inner white circle -->
      <circle cx="0" cy="0" r="14" fill="white" fill-opacity="0.95"/>
    </g>

    <!-- Title -->
    <text x="0" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="white" letter-spacing="-0.03em">
      ContextFlow
    </text>

    <!-- Tagline -->
    <text x="0" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8" font-weight="400" letter-spacing="0.01em">
      Windows-native AI voice dictation. Your thoughts, in flow.
    </text>
  </g>
</svg>
